name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: git-all-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact_name: git-all-darwin-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            artifact_name: git-all-linux-arm64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            artifact_name: git-all-linux-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --manifest-path rust/Cargo.toml --target ${{ matrix.target }}

      - name: Generate man page
        run: cargo run --quiet -p xtask --manifest-path rust/Cargo.toml -- mangen rust/target/${{ matrix.target }}/release

      - name: Create tarball
        run: |
          cd rust/target/${{ matrix.target }}/release
          tar -czvf ../../../../${{ matrix.artifact_name }}.tar.gz git-all git-all.1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Rename artifacts with version
        run: |
          mv git-all-darwin-arm64/git-all-darwin-arm64.tar.gz git-all-${{ steps.version.outputs.version }}-darwin-arm64.tar.gz
          mv git-all-darwin-x86_64/git-all-darwin-x86_64.tar.gz git-all-${{ steps.version.outputs.version }}-darwin-x86_64.tar.gz
          mv git-all-linux-arm64/git-all-linux-arm64.tar.gz git-all-${{ steps.version.outputs.version }}-linux-arm64.tar.gz
          mv git-all-linux-x86_64/git-all-linux-x86_64.tar.gz git-all-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            git-all-${{ steps.version.outputs.version }}-darwin-arm64.tar.gz
            git-all-${{ steps.version.outputs.version }}-darwin-x86_64.tar.gz
            git-all-${{ steps.version.outputs.version }}-linux-arm64.tar.gz
            git-all-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
          generate_release_notes: true

  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    steps:
      - name: Check tap credentials
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "::error::Set HOMEBREW_TAP_TOKEN with Contents read/write access to rsanheim/homebrew-tap. See docs/dev/release.md."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: rsanheim/homebrew-tap
          ref: main
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update formula from published artifacts
        env:
          TAP_PATH: ${{ github.workspace }}/homebrew-tap
        run: script/update-homebrew "${GITHUB_REF_NAME#v}"

      - name: Publish formula
        working-directory: homebrew-tap
        run: |
          if git diff --quiet -- Formula/git-all.rb; then
            echo "Homebrew formula is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/git-all.rb
          git commit -m "git-all ${GITHUB_REF_NAME#v}"
          git push origin HEAD:main
