[workspace]
members = ["xtask"]
# Only the git-all package builds/tests by default; xtask (dev-only man-page
# generation) is built solely via `cargo run -p xtask` / `cargo xtask`, so its
# deps (clap_mangen) never touch normal builds or the shipped binary.
default-members = ["."]

[package]
name = "git-all"
version = "0.7.4"
edition = "2024"
description = "parallel git across many repositories"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
crossterm = "0.29"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "fat"
